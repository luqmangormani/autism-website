<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Unpacking Autism</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Autism</a>
      <a href="resources.html">Resources</a>
      <a href="technology.html">Technology</a>
      <a class="active" href="contact.html">Contact</a>
    </nav>
  </header>
  <main>
    <h2 class="title">Contact / Feedback</h2>
    <div class="card">
      <form id="contactForm">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Your name">
        <label for="email">Email</label>
        <input type="text" id="email" placeholder="you@example.com">
        <label for="message">Message</label>
        <textarea id="message" rows="5" placeholder="Your feedback"></textarea>
        <button type="submit" class="btn">Send</button>
        <p id="formMsg"></p>
      </form>
    </div>
  </main>
  <footer>Created by Muhammad Luqman Younis &middot; BS Information Technology, IUB</footer>
  <script src="script.js"></script>
</body>
</html>
